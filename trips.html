<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Trips — Bite Book</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="entries-page">
  <a href="entries.html" class="wizard-link-start" style="margin-bottom: 20px; display: inline-flex;">‹ Back to My Entries</a>

  <div class="entries-header">
    <p class="eyebrow">food + travel</p>
    <h1>✈️ Your Trips</h1>
    <p class="section-sub" style="margin: 12px 0 0;">Group meals from a trip together into their own story.</p>
  </div>

  <button type="button" class="toggle-link" id="new-trip-toggle">➕ Start a New Trip</button>
  <div class="field-group" id="new-trip-wrap" style="display: none; margin-top: 14px; max-width: 420px;">
    <input type="text" id="new-trip-name" class="text-input" placeholder="e.g. Italy, June 2026" autocomplete="off">
    <button type="button" class="btn btn-primary" id="new-trip-create-btn" style="margin-top: 10px;">Create Trip</button>
  </div>

  <div id="trips-list" class="ranking-list" style="margin-top: 24px;"></div>

  <div id="trips-empty" class="empty-state" style="display: none;">
    <div class="empty-state-icon">✈️</div>
    <h3>No trips yet</h3>
    <p>Start one and add a few entries to it to see your trip's story take shape.</p>
  </div>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js?v=2"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/trips.js"></script>
</body>
</html>
