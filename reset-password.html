<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Bite Book</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<main class="wizard">
  <div class="wizard-card" style="margin-top: 60px;">
    <p class="wizard-kicker">welcome back</p>
    <h1>🔒 Set a New Password</h1>
    <p class="wizard-help" id="reset-help">
      Checking your reset link...
    </p>

    <div class="field-group" id="reset-form-wrap" style="display: none;">
      <input type="password" id="reset-password" class="text-input" placeholder="New password (10+ characters)" autocomplete="new-password">
      <p class="field-sublabel" id="reset-strength-hint"></p>
    </div>

    <div class="field-group" id="reset-confirm-wrap" style="display: none;">
      <input type="password" id="reset-password-confirm" class="text-input" placeholder="Confirm new password" autocomplete="new-password">
    </div>

    <p class="upload-status" id="reset-status"></p>

    <div class="wizard-actions" id="reset-actions-wrap" style="border-top: none; padding-top: 8px; display: none;">
      <div class="wizard-actions-right">
        <button type="button" class="btn btn-primary btn-large" id="reset-btn">Save New Password</button>
      </div>
    </div>

    <p class="field-sublabel" id="reset-fallback-wrap" style="display: none;">
      <a href="login.html">Back to Sign In</a>
    </p>
  </div>
</main>

<script src="js/supabase-config.js"></script>
<script src="js/vendor/capacitor-splash-screen.js"></script>
<script src="js/splash.js"></script>
<script src="js/icons.js?v=2"></script>
<script src="js/pw-policy.js"></script>
<script src="js/pw-toggle.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
