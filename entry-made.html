<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Made It — Bite Book</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="wizard">

  <div class="wizard-progress">
    <div class="wizard-progress-track">
      <div class="wizard-progress-fill" style="width: 56%;"></div>
    </div>
    <span class="wizard-progress-label">Step 5 of 9</span>
    <span class="autosave-badge" id="autosave-hint">💾 Saved</span>
  </div>

  <nav class="step-nav" id="step-nav"></nav>

  <div class="wizard-card">
    <p class="wizard-kicker">credit where it's due</p>
    <h1>Who made it? 👩‍🍳</h1>
    <p class="wizard-help">Give credit to the hands behind the meal.</p>

    <div class="field-group">
      <span class="field-sublabel" id="maker-hint"></span>
      <div class="chip-grid" id="maker-chips">
        <button type="button" class="chip" aria-pressed="false" data-value="me">🙋 I Made It Myself</button>
        <button type="button" class="chip" aria-pressed="false" data-value="mom">👩‍🍳 Mom</button>
        <button type="button" class="chip" aria-pressed="false" data-value="dad">👨‍🍳 Dad</button>
        <button type="button" class="chip" aria-pressed="false" data-value="grandparent">👵 Grandma / Grandpa</button>
        <button type="button" class="chip" aria-pressed="false" data-value="other-family">👨‍👩‍👧 Another Family Member</button>
        <button type="button" class="chip" aria-pressed="false" data-value="chef-restaurant">🧑‍🍳 A Chef / Restaurant</button>
        <button type="button" class="chip" aria-pressed="false" data-value="store-bought">🏪 Store-Bought / Packaged</button>
        <button type="button" class="chip" aria-pressed="false" data-value="other">✏️ Someone Else</button>
      </div>
      <div class="field-group" id="maker-other-wrap" style="margin-top: 14px; display: none;">
        <input
          type="text"
          id="maker-other"
          class="text-input"
          placeholder="Who was it?"
          autocomplete="off"
        >
      </div>
    </div>

    <div class="wizard-section" id="section-maker-name">
      <button type="button" class="toggle-link" id="add-maker-name-link">✏️ Name them</button>
      <div class="field-group" id="maker-name-wrap" style="display: none; margin-top: 14px;">
        <input
          type="text"
          id="maker-name"
          class="text-input"
          placeholder="e.g. Aunt Priya, or Olive Garden"
          autocomplete="off"
        >
        <span class="field-sublabel" style="margin-top: 10px;">Totally optional — just nice to remember later.</span>
      </div>
    </div>

    <div class="wizard-actions">
      <div class="wizard-actions-left">
        <a href="index.html" class="wizard-link-start">🏠 Back to Start</a>
        <button type="button" class="wizard-link-start" id="finish-later-btn" style="background:none;border:none;cursor:pointer;padding:0;font-family:inherit;">🏁 Finish Later</button>
      </div>
      <div class="wizard-actions-right">
        <a href="#" class="btn btn-back" id="back-btn">‹ Back</a>
        <button type="button" class="btn btn-primary" id="continue-btn" disabled>Save &amp; Continue →</button>
      </div>
    </div>

    <p class="saved-toast" id="saved-toast">🎉 Saved! Taking you to the next part...</p>
  </div>

</main>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js?v=2"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/step-nav.js"></script>
<script src="js/entry-made.js"></script>
</body>
</html>
