<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where You Ate It — Bite Book</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="wizard">

  <div class="wizard-progress">
    <div class="wizard-progress-track">
      <div class="wizard-progress-fill" style="width: 33%;"></div>
    </div>
    <span class="wizard-progress-label">Step 3 of 9</span>
    <span class="autosave-badge" id="autosave-hint">💾 Saved</span>
  </div>

  <nav class="step-nav" id="step-nav"></nav>

  <div class="wizard-card">
    <p class="wizard-kicker">getting the picture</p>
    <h1>So, where did it happen? 📍</h1>
    <p class="wizard-help">
      This is about where the food came from — even if you're writing this down later, from somewhere else entirely.
    </p>

    <div class="field-group">
      <input
        type="text"
        id="place-name"
        class="text-input"
        placeholder="e.g. IHOP Diner, or Mom's Kitchen"
        autocomplete="off"
        list="place-name-suggestions"
      >
      <datalist id="place-name-suggestions"></datalist>
    </div>

    <div class="geo-row">
      <button type="button" class="btn-geo" id="use-geo-btn">📍 Use My Current Location</button>
      <span class="geo-status" id="geo-status"></span>
    </div>

    <button type="button" class="toggle-link" id="add-address-link">✏️ Add a more exact address</button>
    <div class="field-group" id="address-wrap" style="display: none; margin-top: 14px;">
      <input
        type="text"
        id="place-address"
        class="text-input"
        placeholder="e.g. Rt 27, Edison, NJ"
        autocomplete="off"
      >
    </div>

    <div class="wizard-section" id="section-place-type">
      <label class="field-label">What kind of place was it?</label>
      <span class="field-sublabel">Pick the one that fits best.</span>
      <div class="chip-grid" id="place-type-chips">
        <button type="button" class="chip" aria-pressed="false" data-value="home">🏠 Home</button>
        <button type="button" class="chip" aria-pressed="false" data-value="restaurant">🍽️ Restaurant / Café</button>
        <button type="button" class="chip" aria-pressed="false" data-value="someone-else">🏡 Someone Else's Place</button>
        <button type="button" class="chip" aria-pressed="false" data-value="work-school">🏫 Work / School</button>
        <button type="button" class="chip" aria-pressed="false" data-value="on-the-go">🚗 On the Go</button>
        <button type="button" class="chip" aria-pressed="false" data-value="travel">✈️ Travelling</button>
        <button type="button" class="chip" aria-pressed="false" data-value="other">✏️ Something Else</button>
      </div>
      <div class="field-group" id="place-type-other-wrap" style="margin-top: 14px; display: none;">
        <input
          type="text"
          id="place-type-other"
          class="text-input"
          placeholder="Tell us where..."
          autocomplete="off"
        >
      </div>
    </div>

    <div class="wizard-actions">
      <div class="wizard-actions-left">
        <a href="index.html" class="wizard-link-start">🏠 Back to Start</a>
        <button type="button" class="wizard-link-start" id="finish-later-btn" style="background:none;border:none;cursor:pointer;padding:0;font-family:inherit;">🏁 Finish Later</button>
      </div>
      <div class="wizard-actions-right">
        <a href="#" class="btn btn-back" id="back-btn">‹ Back</a>
        <button type="button" class="btn btn-primary" id="continue-btn" disabled>Save &amp; Continue →</button>
      </div>
    </div>

    <p class="saved-toast" id="saved-toast">🎉 Saved! Taking you to the next part...</p>
  </div>

</main>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js?v=2"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/step-nav.js"></script>
<script src="js/entry-where.js"></script>
</body>
</html>
