<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Entries — Bite Book</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="entries-page">
  <div class="entries-header">
    <p class="eyebrow">your story so far</p>
    <h1>My Entries</h1>
    <p class="section-sub" style="margin: 12px 0 0;">Pick one up where you left off, or start something new.</p>
  </div>

  <div id="year-banner" class="on-this-day" style="display: none;"></div>

  <div id="streak-strip" class="streak-strip" style="display: none;"></div>

  <div id="occasions" class="on-this-day" style="display: none;"></div>

  <div id="on-this-day" class="on-this-day" style="display: none;"></div>

  <div class="entries-toolbar">
    <input type="search" id="search-input" class="text-input" placeholder="Search your entries...">
    <div class="chip-grid" id="status-filter-chips">
      <button type="button" class="chip small selected" aria-pressed="true" data-value="all">All</button>
      <button type="button" class="chip small" aria-pressed="false" data-value="complete">✓ Complete</button>
      <button type="button" class="chip small" aria-pressed="false" data-value="draft">Draft</button>
    </div>
  </div>

  <div class="entries-actions-row">
    <a href="stats.html" class="link-pill"><span data-icon="chart"></span> Stats</a>
    <a href="ranking.html" class="link-pill"><span data-icon="trophy"></span> Rankings</a>
    <a href="trips.html" class="link-pill"><span data-icon="suitcase"></span> Trips</a>
    <a href="wishlist.html" class="link-pill"><span data-icon="bookmark"></span> Want to Try</a>
    <a href="year.html" class="link-pill"><span data-icon="calendar"></span> Your Year</a>
    <a href="patterns.html" class="link-pill"><span data-icon="chart"></span> Patterns</a>
    <a href="recommend.html" class="link-pill"><span data-icon="pin"></span> Where To Eat</a>
    <a href="ask.html" class="link-pill"><span data-icon="chat"></span> Ask Your Journal</a>
    <button type="button" class="link-pill" id="export-btn"><span data-icon="download"></span> Export</button>
    <button type="button" class="link-pill" id="import-btn"><span data-icon="upload"></span> Import</button>
    <input type="file" id="import-file-input" accept=".json" style="display: none;">
  </div>
  <p class="upload-status" id="import-export-status"></p>

  <p class="upload-status" id="smart-search-active-note" style="display: none;"></p>

  <div id="active-filter" class="active-filter" style="display: none;"></div>

  <div id="dedupe-banner" class="dedupe-banner" style="display: none;"></div>

  <div id="entries-list" class="entries-list"></div>

  <div id="no-results-state" class="empty-state" style="display: none;">
    <div class="empty-state-icon"><span data-icon="search" data-icon-class="icn-lg"></span></div>
    <h3>No matches</h3>
    <p>Try a different search or filter.</p>
    <button type="button" class="btn btn-back" id="smart-search-btn" style="margin-top: 12px;">✨ Try Smart Search</button>
    <p class="upload-status" id="smart-search-status"></p>
  </div>

  <div id="empty-state" class="empty-state" style="display: none;">
    <div class="empty-state-icon"><span data-icon="plate" data-icon-class="icn-lg"></span></div>
    <h3>Nothing here yet</h3>
    <p>Your first entry is just a tap away.</p>
    <a href="smart-entry.html" class="btn btn-primary"><span data-icon="sparkle"></span> Start My First Entry</a>
  </div>
</main>

<div class="undo-toast" id="undo-toast">
  <span id="undo-toast-text"></span>
  <button type="button" id="undo-toast-btn">Undo</button>
</div>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/icons.js?v=2"></script>
<script src="js/roles.js?v=1"></script>
<script src="js/partials.js?v=5"></script>
<script src="js/platform.js"></script>
<script src="js/track.js?v=1"></script>
<script src="js/profile.js?v=4"></script>
<script src="js/geo.js?v=3"></script>
<script src="js/storage.js?v=5"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/ai.js?v=4"></script>
<script src="js/duplicates.js"></script>
<script src="js/occasions.js?v=2"></script>
<script src="js/streak.js?v=2"></script>
<script src="js/share-card.js?v=2"></script>
<script src="js/search.js?v=1"></script>
<script src="js/year-review.js?v=1"></script>
<script src="js/entries-list.js?v=6"></script>
</body>
</html>
