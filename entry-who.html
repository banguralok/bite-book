<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who You Ate With — Bite Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="wizard">

  <div class="wizard-progress">
    <div class="wizard-progress-track">
      <div class="wizard-progress-fill" style="width: 44%;"></div>
    </div>
    <span class="wizard-progress-label">Step 4 of 9</span>
    <span class="autosave-badge" id="autosave-hint">💾 Saved</span>
  </div>

  <div class="wizard-card">
    <p class="wizard-kicker">good company</p>
    <h1>Who was with you? 👋</h1>
    <p class="wizard-help">Even a solo snack deserves a mention. Pick as many as fit.</p>

    <div class="field-group">
      <div class="chip-grid" id="companion-chips">
        <button type="button" class="chip" aria-pressed="false" data-value="solo">🧍 Just Me</button>
        <button type="button" class="chip" aria-pressed="false" data-value="family">👨‍👩‍👧‍👦 Family</button>
        <button type="button" class="chip" aria-pressed="false" data-value="friends">👫 Friends</button>
        <button type="button" class="chip" aria-pressed="false" data-value="someone-special">💑 Someone Special</button>
        <button type="button" class="chip" aria-pressed="false" data-value="classmates-coworkers">👥 Classmates / Coworkers</button>
        <button type="button" class="chip" aria-pressed="false" data-value="big-group">🎉 A Big Group</button>
        <button type="button" class="chip" aria-pressed="false" data-value="other">✏️ Someone Else</button>
      </div>
      <div class="field-group" id="companion-other-wrap" style="margin-top: 14px; display: none;">
        <input
          type="text"
          id="companion-other"
          class="text-input"
          placeholder="Tell us a bit more..."
          autocomplete="off"
        >
      </div>
    </div>

    <div class="wizard-section" id="section-family-picker">
      <label class="field-label">Which family members?</label>
      <span class="field-sublabel">Tap the ones who were there.</span>
      <div class="chip-grid" id="family-picker-chips"></div>
    </div>

    <div class="wizard-section" id="section-names">
      <button type="button" class="toggle-link" id="add-names-link">✏️ Name Them</button>
      <div class="field-group" id="names-wrap" style="display: none; margin-top: 14px;">
        <input
          type="text"
          id="companion-names"
          class="text-input"
          placeholder="e.g. Mom, Dad, and Priya"
          autocomplete="off"
        >
        <span class="field-sublabel" style="margin-top: 10px;">Totally optional — just nice to remember later.</span>
      </div>
    </div>

    <div class="wizard-actions">
      <div class="wizard-actions-left">
        <a href="index.html" class="wizard-link-start">🏠 Back to Start</a>
        <button type="button" class="wizard-link-start" id="finish-later-btn" style="background:none;border:none;cursor:pointer;padding:0;font-family:inherit;">🏁 Finish Later</button>
      </div>
      <div class="wizard-actions-right">
        <a href="#" class="btn btn-back" id="back-btn">‹ Back</a>
        <button type="button" class="btn btn-primary" id="continue-btn" disabled>Save &amp; Continue →</button>
      </div>
    </div>

    <p class="saved-toast" id="saved-toast">🎉 Saved! Taking you to the next part...</p>
  </div>

</main>

<footer class="footer" id="site-footer"></footer>

<script src="js/partials.js?v=2"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/entry-who.js"></script>
</body>
</html>
