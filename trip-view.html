<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip — Bite Book</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="entries-page">
  <a href="trips.html" class="wizard-link-start" style="margin-bottom: 20px; display: inline-flex;">‹ Back to Your Trips</a>

  <div class="entries-header">
    <p class="eyebrow">the trip story</p>
    <h1 id="trip-name">✈️ Trip</h1>
  </div>

  <div id="trip-stats" class="stat-tiles"></div>

  <div class="entries-actions-row">
    <button type="button" class="link-pill" id="add-entries-toggle">➕ Add Entries</button>
    <button type="button" class="link-pill" id="delete-trip-btn">🗑️ Delete Trip</button>
  </div>

  <div id="add-entries-wrap" class="dedupe-group-card" style="display: none; margin-top: 14px;">
    <strong>Add entries to this trip</strong>
    <div id="add-entries-list" class="chip-grid" style="margin-top: 10px;"></div>
    <p class="stat-empty-note" id="add-entries-empty" style="display: none;">All your complete entries are already in a trip.</p>
  </div>

  <div id="trip-entries-list" class="entries-list" style="margin-top: 24px;"></div>

  <div id="trip-empty" class="empty-state" style="display: none;">
    <div class="empty-state-icon">✈️</div>
    <h3>Nothing added yet</h3>
    <p>Use "Add Entries" above to start building this trip's story.</p>
  </div>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js?v=2"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/trip-view.js"></script>
</body>
</html>
