<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ingredients — Bite Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="wizard">

  <div class="wizard-progress">
    <div class="wizard-progress-track">
      <div class="wizard-progress-fill" style="width: 78%;"></div>
    </div>
    <span class="wizard-progress-label">Step 7 of 9</span>
    <span class="autosave-badge" id="autosave-hint">💾 Saved</span>
  </div>

  <div class="wizard-card">
    <p class="wizard-kicker">what went in</p>
    <h1>What was it made of? 🥕</h1>
    <p class="wizard-help">However you've got it — words, a link, or a photo of the recipe. Totally optional.</p>

    <div class="field-group">
      <label class="field-label">Jot it down</label>
      <textarea
        id="ingredients-text"
        class="text-area"
        placeholder="e.g. Rice, lentils, mustard seeds, curry leaves, coconut..."
        rows="4"
      ></textarea>
    </div>

    <div class="divider-label">or</div>

    <div class="field-group">
      <label class="field-label">Got a recipe link?</label>
      <div class="link-input-row">
        <input
          type="url"
          id="ingredients-link"
          class="text-input"
          placeholder="Paste a link from Instagram, YouTube, a blog..."
          autocomplete="off"
        >
        <span class="link-platform-badge" id="link-platform-badge"></span>
      </div>
    </div>

    <div class="divider-label">or</div>

    <div class="field-group">
      <label class="field-label">Attach a photo or document</label>
      <button type="button" class="file-upload-btn" id="file-upload-btn">📎 Choose a File</button>
      <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.txt" style="display: none;">
      <div class="file-preview" id="file-preview">
        <img class="file-preview-thumb" id="file-preview-thumb" style="display: none;" alt="">
        <div class="file-preview-icon" id="file-preview-icon" style="display: none;"></div>
        <span class="file-preview-name" id="file-preview-name"></span>
        <button type="button" class="file-preview-remove" id="file-remove-btn" title="Remove file" aria-label="Remove attached file">✕</button>
      </div>
      <p class="upload-status" id="upload-status"></p>
    </div>

    <div class="wizard-actions">
      <div class="wizard-actions-left">
        <a href="index.html" class="wizard-link-start">🏠 Back to Start</a>
        <button type="button" class="wizard-link-start" id="finish-later-btn" style="background:none;border:none;cursor:pointer;padding:0;font-family:inherit;">🏁 Finish Later</button>
      </div>
      <div class="wizard-actions-right">
        <a href="#" class="btn btn-back" id="back-btn">‹ Back</a>
        <button type="button" class="btn btn-primary" id="continue-btn">Save &amp; Continue →</button>
      </div>
    </div>

    <p class="saved-toast" id="saved-toast">🎉 Saved! Taking you to the good part...</p>
  </div>

</main>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js?v=2"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/entry-ingredients.js"></script>
</body>
</html>
