<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>When You Ate It — Bite Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a4c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<header class="nav" id="site-header"></header>

<main class="wizard">

  <div class="wizard-progress">
    <div class="wizard-progress-track">
      <div class="wizard-progress-fill" style="width: 22%;"></div>
    </div>
    <span class="wizard-progress-label">Step 2 of 9</span>
    <span class="autosave-badge" id="autosave-hint">💾 Saved</span>
  </div>

  <nav class="step-nav" id="step-nav"></nav>

  <div class="wizard-card">
    <p class="wizard-kicker">next up</p>
    <h1>So, when did this happen? 🕰️</h1>
    <p class="wizard-help">Doesn't have to be exact — just enough to jog the memory later.</p>

    <div class="field-group">
      <label class="field-label">Which day?</label>
      <div class="chip-grid" id="date-chips">
        <button type="button" class="chip" aria-pressed="false" data-value="today">📆 Today</button>
        <button type="button" class="chip" aria-pressed="false" data-value="yesterday">↩️ Yesterday</button>
        <button type="button" class="chip" aria-pressed="false" data-value="2-days-ago">⏪ A Couple Days Ago</button>
        <button type="button" class="chip" aria-pressed="false" data-value="pick">📅 Pick a Date</button>
      </div>
      <div class="field-group" id="date-picker-wrap" style="margin-top: 14px; display: none;">
        <input type="date" id="date-picker" class="text-input">
      </div>
      <span class="date-confirm" id="date-confirm"></span>
    </div>

    <div class="wizard-section" id="section-time">
      <label class="field-label">About what time?</label>
      <span class="field-sublabel" id="time-hint"></span>

      <div id="fuzzy-time-wrap">
        <div class="chip-grid" id="time-chips">
          <button type="button" class="chip" aria-pressed="false" data-value="early-morning">🌅 Early Morning</button>
          <button type="button" class="chip" aria-pressed="false" data-value="morning">🌤️ Morning</button>
          <button type="button" class="chip" aria-pressed="false" data-value="midday">☀️ Midday</button>
          <button type="button" class="chip" aria-pressed="false" data-value="afternoon">🌇 Afternoon</button>
          <button type="button" class="chip" aria-pressed="false" data-value="evening">🌆 Evening</button>
          <button type="button" class="chip" aria-pressed="false" data-value="night">🌃 Night</button>
          <button type="button" class="chip" aria-pressed="false" data-value="late-night">🌙 Late Night</button>
        </div>
        <button type="button" class="toggle-link" id="use-exact-time">🎯 I know the exact time</button>
      </div>

      <div id="exact-time-wrap" style="display: none;">
        <div class="field-group">
          <input type="time" id="exact-time-input" class="text-input">
        </div>
        <button type="button" class="toggle-link" id="use-fuzzy-time">↩️ Just roughly is fine</button>
      </div>
    </div>

    <div class="wizard-actions">
      <div class="wizard-actions-left">
        <a href="index.html" class="wizard-link-start">🏠 Back to Start</a>
        <button type="button" class="wizard-link-start" id="finish-later-btn" style="background:none;border:none;cursor:pointer;padding:0;font-family:inherit;">🏁 Finish Later</button>
      </div>
      <div class="wizard-actions-right">
        <a href="#" class="btn btn-back" id="back-btn">‹ Back</a>
        <button type="button" class="btn btn-primary" id="continue-btn" disabled>Save &amp; Continue →</button>
      </div>
    </div>

    <p class="saved-toast" id="saved-toast">🎉 Saved! Taking you to the next part...</p>
  </div>

</main>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/partials.js?v=2"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/labels.js?v=2"></script>
<script src="js/step-nav.js"></script>
<script src="js/entry-when.js"></script>
</body>
</html>
